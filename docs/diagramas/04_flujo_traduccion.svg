es++</text><rect x="315" y="390" width="250" height="60" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="440.0" y="417.3" font-family="Courier New, monospace" font-size="12" fill="#000000" text-anchor="middle" xml:space="preserve">pageTable.resolve(va)</text><text x="440.0" y="431.4" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">crea la tabla de nivel 2 si no existe</text><path d="M440.0,480 L540,530.0 L440.0,580 L340,530.0 Z" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="440.0" y="534.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">¿PTE.valid?</text><rect x="80" y="500" width="200" height="60" rx="6" ry="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="180.0" y="527.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">HIT</text><text x="180.0" y="541.4" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">policy.onAccess(frame)</text><rect x="340" y="615" width="200" height="56" rx="6" ry="6" fill="#f8cecc" stroke="#b85450" stroke-width="1"/><text x="440.0" y="640.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">FALLO DE PÁGINA</text><text x="440.0" y="654.4" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">pageFaults++</text><path d="M440.0,705 L540,755.0 L440.0,805 L340,755.0 Z" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="440.0" y="759.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" xml:space="preserve">¿marco libre?</text><rect x="610" y="705" width="260" height="110" rx="6" ry="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/><text x="616.0" y="736.7" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="start" font-weight="bold" xml:space="preserve">Reemplazo</text><text x="616.0" y="750.7" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">v = policy.selectVictim()</text><text x="616.0" y="764.5" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">si PTE(v).dirty: swap.store</text><text x="616.0" y="778.2" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">PTE(v).valid = 0</text><text x="616.0" y="792.0" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">releaseFrame(v); replacements++</text><rect x="340" y="845" width="200" height="50" rx="6" ry="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="440.0" y="874.2" font-family="Courier New, monospace" font-size="12" fill="#000000" text-anchor="middle" xml:space="preserve">acquireFrame(vpn)</text><path d="M440.0,930 L540,980.0 L440.0,1030 L340,980.0 Z" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="440.0" y="984.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" xml:space="preserve">¿PTE.swapped?</text><rect x="80" y="950" width="200" height="60" rx="6" ry="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/><text x="180.0" y="977.0" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">swap.load(vpn, marco)</text><text x="180.0" y="990.7" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">swapIns++</text><rect x="600" y="950" width="200" height="60" rx="6" ry="6" fill="#f5f5f5" stroke="#666666" stroke-width="1"/><text x="700.0" y="977.0" font-family="Courier New, monospace" font-size