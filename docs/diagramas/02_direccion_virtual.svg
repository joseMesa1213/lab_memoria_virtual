<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660"><rect width="100%" height="100%" fill="#ffffff"/><text x="26.0" y="36.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000000" text-anchor="start" font-weight="bold" xml:space="preserve">Dirección virtual de 32 bits (páginas de 4 KB)</text><text x="26.0" y="58.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="start" xml:space="preserve">Descomposición PT1 | PT2 | Offset y ejemplo de traducción de 0x00403ABC</text><text x="90.0" y="96.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="start" xml:space="preserve">31</text><text x="338.0" y="96.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="end" xml:space="preserve">22</text><rect x="84" y="104" width="260" height="50" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="214.0" y="126.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">PT1  (10 bits)</text><text x="214.0" y="140.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">índice nivel 1 (1024 entradas)</text><rect x="84" y="154" width="260" height="34" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/><text x="214.0" y="175.9" font-family="Courier New, monospace" font-size="14" fill="#000000" text-anchor="middle" xml:space="preserve">0000000001</text><text x="350.0" y="96.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="start" xml:space="preserve">21</text><text x="598.0" y="96.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="end" xml:space="preserve">12</text><rect x="344" y="104" width="260" height="50" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="474.0" y="126.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">PT2  (10 bits)</text><text x="474.0" y="140.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">índice nivel 2 (1024 entradas)</text><rect x="344" y="154" width="260" height="34" fill="#ffffff" stroke="#82b366" stroke-width="1"/><text x="474.0" y="175.9" font-family="Courier New, monospace" font-size="14" fill="#000000" text-anchor="middle" xml:space="preserve">0000000011</text><text x="610.0" y="96.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="start" xml:space="preserve">11</text><text x="910.0" y="96.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="end" xml:space="preserve">0</text><rect x="604" y="104" width="312" height="50" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="760.0" y="126.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">Offset  (12 bits)</text><text x="760.0" y="140.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">desplazamiento en la página</text><rect x="604" y="154" width="312" height="34" fill="#ffffff" stroke="#d6b656" stroke-width="1"/><text x="760.0" y="175.9" font-family="Courier New, monospace" font-size="14" fill="#000000" text-anchor="middle" xml:space="preserve">101010111100</text><text x="50.0" y="133.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">VA</text><text x="46.0" y="174.5" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">0x00403ABC</text><rect x="90" y="250" width="220" height="56" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="200.0" y="275.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">PT1 = 0x001 = 1</text><text x="200.0" y="289.4" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">va &gt;&gt; 22</text><rect x="390" y="250" width="220" height="56" rx="6" ry="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="500.0" y="275.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">PT2 = 0x003 = 3</text><text x="500.0" y="289.4" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">(va &gt;&gt; 12) &amp; 0x3FF</text><rect x="690" y="250" width="220" height="56" rx="6" ry="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="800.0" y="275.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">Offset = 0xABC</text><text x="800.0" y="289.4" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">va &amp; 0xFFF</text><rect x="90" y="350" width="220" height="60" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="200.0" y="377.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">directorio[1]</text><text x="200.0" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">→ tabla de nivel 2 (existe o se crea)</text><rect x="390" y="350" width="220" height="60" rx="6" ry="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="500.0" y="377.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">tabla2[3] = PTE</text><text x="500.0" y="391.4" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">frame=0 V=1 A=1 D=1 S=0</text><rect x="690" y="350" width="220" height="60" rx="6" ry="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/><text x="800.0" y="377.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">PA = 0x00000ABC</text><text x="800.0" y="391.4" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">(frame &lt;&lt; 12) | offset</text><text x="66.0" y="456.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="start" font-weight="bold" xml:space="preserve">Tamaño de página configurable (AddressLayout)</text><text x="66.0" y="479.2" font-family="Courier New, monospace" font-size="12" fill="#000000" text-anchor="start" xml:space="preserve">offsetBits = log2(pageSize)   pt2Bits = (32 - offsetBits) / 2   pt1Bits = 32 - offsetBits - pt2Bits</text><rect x="60" y="496" width="110" height="26" fill="#f5f5f5" stroke="#666666" stroke-width="1"/><text x="115.0" y="512.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">Página</text><rect x="170" y="496" width="80" height="26" fill="#f5f5f5" stroke="#666666" stroke-width="1"/><text x="210.0" y="512.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">PT1</text><rect x="250" y="496" width="80" height="26" fill="#f5f5f5" stroke="#666666" stroke-width="1"/><text x="290.0" y="512.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">PT2</text><rect x="330" y="496" width="90" height="26" fill="#f5f5f5" stroke="#666666" stroke-width="1"/><text x="375.0" y="512.9" font-family