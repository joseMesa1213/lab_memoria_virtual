<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640"><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="80" width="760" height="250" fill="#ffffff" stroke="#6c8ebf"/><rect x="30" y="80" width="760" height="28" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="410.0" y="98.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">FIFO  (FifoPolicy → FrameList)</text><rect x="30" y="350" width="760" height="270" fill="#ffffff" stroke="#d79b00"/><rect x="30" y="350" width="760" height="28" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/><text x="410.0" y="368.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">LRU  (LruPolicy → FrameList)</text><rect x="820" y="80" width="450" height="540" fill="#ffffff" stroke="#82b366"/><rect x="820" y="80" width="450" height="28" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="1045.0" y="98.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">CLOCK  (ClockPolicy, segunda oportunidad)</text><text x="26.0" y="36.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000000" text-anchor="start" font-weight="bold" xml:space="preserve">Políticas de reemplazo: estructuras de datos</text><text x="26.0" y="58.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="start" xml:space="preserve">Todas las operaciones son O(1) salvo el barrido de CLOCK (O(n) amortizado)</text><rect x="70" y="160" width="110" height="50" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="125.0" y="182.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 3</text><text x="125.0" y="196.0" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">vpn 0x010</text><rect x="210" y="160" width="110" height="50" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="265.0" y="182.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 0</text><text x="265.0" y="196.0" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">vpn 0x002</text><rect x="350" y="160" width="110" height="50" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="405.0" y="182.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 7</text><text x="405.0" y="196.0" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">vpn 0x0A1</text><rect x="490" y="160" width="110" height="50" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="545.0" y="182.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 1</text><text x="545.0" y="196.0" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">vpn 0x033</text><rect x="630" y="160" width="110" height="50" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="685.0" y="182.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 5</text><text x="685.0" y="196.0" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">vpn 0x004</text><text x="46.0" y="139.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" font-weight="bold" xml:space="preserve">frente = más antigua</text><text x="774.0" y="139.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="end" font-weight="bold" xml:space="preserve">final = más reciente</text><text x="46.0" y="246.8" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">selectVictim(): popFront()</text><text x="774.0" y="246.8" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="end" xml:space="preserve">onLoad(f): pushBack(f)</text><text x="46.0" y="282.1" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">onAccess(): no hace nada → no aprovecha la localidad; una página muy usada</text><text x="46.0" y="295.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">puede expulsarse solo por ser vieja. Sufre la anomalía de Belady.</text><text x="46.0" y="309.6" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">position_[marco] guarda el iterador → onRelease() en O(1)</text><rect x="70" y="430" width="110" height="50" rx="6" ry="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/><text x="125.0" y="452.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 3</text><text x="125.0" y="466.0" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">vpn 0x010</text><rect x="210" y="430" width="110" height="50" rx="6" ry="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/><text x="265.0" y="452.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 0</text><text x="265.0" y="466.0" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">vpn 0x002</text><rect x="350" y="430" width="110" height="50" rx="6" ry="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/><text x="405.0" y="452.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 7</text><text x="405.0" y="466.0" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">vpn 0x0A1</text><rect x="490" y="430" width="110" height="50" rx="6" ry="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/><text x="545.0" y="452.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 1</text><text x="545.0" y="466.0" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">vpn 0x033</text><rect x="630" y="430" width="110" height="50" rx="6" ry="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/><text x="685.0" y="452.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 5</text><text x="685.0" y="466.0" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">vpn 0x004</text><text x="46.0" y="409.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" font-weight="bold" xml:space="preserve">frente = LRU (víctima)</text><text x="774.0" y="409.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="end" font-weight="bold" xml:space="preserve">final = MRU</text><text x="46.0" y="555.1" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">selectVictim(): popFront()     onLoad(f): pushBack(f)     onAccess(f): moveToBack(f)</text><text x="46.0" y="568.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">std::list + vector&lt;iterator&gt;: mover un nodo al final es O(1) sin recorrer la lista.</text><text x="46.0" y="582.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Es un algoritmo de pila: con más marcos nunca produce más fallos.</text><rect x="1000.0" y="155.0" width="90" height="50" rx="6" ry="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="1045.0" y="177.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 0</text><text x="1045.0" y="190.4" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">A=1 0x010</text><rect x="1106.066017177982" y="198.93398282201787" width="90" height="50" rx="6" ry="6" fill="#f8cecc" stroke="#b85450" stroke-width="1"/><text x="1151.1" y="221.5" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 1</text><text x="1151.1" y="234.3" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">A=0 0x002</text><rect x="1150.0" y="305.0" width="90" height="50" rx="6" ry="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="1195.0" y="327.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 2</text><text x="1195.0" y="340.4" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">A=1 0x0A1</text><rect x="1106.066017177982" y="411.06601717798213" width="90" height="50" rx="6" ry="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="1151.1" y="433.7" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 3</text><text x="1151.1" y="446.4" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">A=1 0x033</text><rect x="1000.0" y="455.0" width="90" height="50" rx="6" ry="6" fill="#f5f5f5" stroke="#666666" stroke-width="1"/><text x="1045.0" y="477.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 4</text><text x="1045.0" y="490.4" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">A=0 0x004</text><rect x="893.9339828220179" y="411.06601717798213" width="90" height="50" rx="6" ry="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="938.9" y="433.7" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 5</text><text x="938.9" y="446.4" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">A=1 0x07F</text><rect x="850.0" y="305.0" width="90" height="50" rx="6" ry="6" fill="#f5f5f5" stroke="#666666" stroke-width="1"/><text x="895.0" y="327.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 6</text><text x="895.0" y="340.4" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">A=0 0x120</text><rect x="893.9339828220178" y="198.93398282201787" width="90" height="50" rx="6" ry="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="938.9" y="221.5" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">marco 7</text><text x="938.9" y="234.3" font-family="Courier New, monospace" font-size="10" fill="#000000" text-anchor="middle" xml:space="preserve">A=1 0x055</text><ellipse cx="1045.0" cy="330.0" rx="30.0" ry="30.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1045.0" y="333.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold" xml:space="preserve">hand</text><text x="1031.0" y="243.5" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#555555" text-anchor="end" xml:space="preserve">posición actual</text><text x="846.0" y="548.2" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">mientras true:</text><text x="846.0" y="562.0" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">  si A[hand] = 1: A = 0; hand++</text><text x="846.0" y="575.7" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">  si A[hand] = 0: víctima = hand; hand++</text><text x="846.0" y="589.5" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">marco 0 pierde su bit y marco 1 (A=0) es la víctima.</text><polyline points="180.0,185.0 203.0,185.0" fill="none" stroke="#333333" stroke-width="1"/><path d="M210.0,185.0 L200.0,190.0 L203.0,185.0 L200.0,180.0 Z" fill="#333333" stroke="#333333"/><path d="M180.0,185.0 L190.0,180.0 L187.0,185.0 L190.0,190.0 Z" fill="#333333" stroke="#333333"/><polyline points="320.0,185.0 343.0,185.0" fill="none" stroke="#333333" stroke-width="1"/><path d="M350.0,185.0 L340.0,190.0 L343.0,185.0 L340.0,180.0 Z" fill="#333333" stroke="#333333"/><path d="M320.0,185.0 L330.0,180.0 L327.0,185.0 L330.0,190.0 Z" fill="#333333" stroke="#333333"/><polyline points="460.0,185.0 483.0,185.0" fill="none" stroke="#333333" stroke-width="1"/><path d="M490.0,185.0 L480.0,190.0 L483.0,185.0 L480.0,180.0 Z" fill="#333333" stroke="#333333"/><path d="M460.0,185.0 L470.0,180.0 L467.0,185.0 L470.0,190.0 Z" fill="#333333" stroke="#333333"/><polyline points="600.0,185.0 623.0,185.0" fill="none" stroke="#333333" stroke-width="1"/><path d="M630.0,185.0 L620.0,190.0 L623.0,185.0 L620.0,180.0 Z" fill="#333333" stroke="#333333"/><path d="M600.0,185.0 L610.0,180.0 L607.0,185.0 L610.0,190.0 Z" fill="#333333" stroke="#333333"/><polyline points="180.0,455.0 203.0,455.0" fill="none" stroke="#333333" stroke-width="1"/><path d="M210.0,455.0 L200.0,460.0 L203.0,455.0 L200.0,450.0 Z" fill="#333333" stroke="#333333"/><path d="M180.0,455.0 L190.0,450.0 L187.0,455.0 L190.0,460.0 Z" fill="#333333" stroke="#333333"/><polyline points="320.0,455.0 343.0,455.0" fill="none" stroke="#333333" stroke-width="1"/><path d="M350.0,455.0 L340.0,460.0 L343.0,455.0 L340.0,450.0 Z" fill="#333333" stroke="#333333"/><path d="M320.0,455.0 L330.0,450.0 L327.0,455.0 L330.0,460.0 Z" fill="#333333" stroke="#333333"/><polyline points="460.0,455.0 483.0,455.0" fill="none" stroke="#333333" stroke-width="1"/><path d="M490.0,455.0 L480.0,460.0 L483.0,455.0 L480.0,450.0 Z" fill="#333333" stroke="#333333"/><path d="M460.0,455.0 L470.0,450.0 L467.0,455.0 L470.0,460.0 Z" fill="#333333" stroke="#333333"/><polyline points="600.0,455.0 623.0,455.0" fill="none" stroke="#333333" stroke-width="1"/><path d="M630.0,455.0 L620.0,460.0 L623.0,455.0 L620.0,450.0 Z" fill="#333333" stroke="#333333"/><path d="M600.0,455.0 L610.0,450.0 L607.0,455.0 L610.0,460.0 Z" fill="#333333" stroke="#333333"/><polyline points="265.0,480.0 265.0,505.0 685.0,505.0 685.0,487.0" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="6 4"/><path d="M685.0,480.0 L690.0,490.0 L685.0,487.0 L680.0,490.0 Z" fill="#333333" stroke="#333333"/><rect x="379.6" y="498.1" width="190.8" height="13.8" fill="#ffffff"/><text x="475.0" y="508.9" font-family="Courier New, monospace" font-size="11" fill="#000000" text-anchor="middle" xml:space="preserve">onAccess(0): splice al final</text><polyline points="1045.0,300.0 1045.0,212.0" fill="none" stroke="#333333" stroke-width="2"/><path d="M1045.0,205.0 L1050.0,215.0 L1045.0,212.0 L1040.0,215.0 Z" fill="#333333" stroke="#333333"/></svg>
